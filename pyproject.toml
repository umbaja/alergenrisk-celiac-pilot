[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alergenrisk-celiac-pilot"
version = "0.1.0"
description = "Reproducible synthetic-data and ML fidelity pilot for the AlergenRisk coeliac panel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]


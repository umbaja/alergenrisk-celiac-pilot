name: Validate celiac pilot

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_pipeline.py --samples 3000 --seed 20261014 --training-steps 500
      - uses: actions/upload-artifact@v4
        with:
          name: celiac-pilot-validation
          path: |
            artifacts/metrics/evaluation.json
            artifacts/reports/evaluation.md
            site/index.html


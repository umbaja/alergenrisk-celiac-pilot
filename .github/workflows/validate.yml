name: Validate AlergenRisk research pilot

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_pipeline.py --samples 3000 --seed 20261014 --training-steps 500
      - run: python scripts/run_multitrait_pipeline.py --samples-per-trait 1800 --seed 20261014 --training-steps 400
      - run: python scripts/build_multitrait_assets.py
      - run: python scripts/build_release_assets.py
      - run: node --test tests/web_app.test.mjs tests/multitrait_web.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: celiac-pilot-validation
          path: |
            artifacts/metrics/evaluation.json
            artifacts/reports/evaluation.md
            site/assets/evaluation.json
            artifacts/multitrait/evaluation.json
            site/assets/multitrait-evaluation.json
            artifacts/release-manifest.json

